{% extends 'base.html' %}

{% block titulo %}Contacto{% endblock %}

{% block contenido %}
<style>
    .contacto-container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 20px;
    }
    
    .contacto-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
    }
    
    .contacto-form {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    .contacto-form h2 {
        color: #667eea;
        margin-bottom: 30px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }
    
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1em;
    }
    
    .form-group textarea {
        height: 150px;
        resize: vertical;
    }
    
    .submit-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
    }
    
    .map-container {
        background: white;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    .map-container iframe {
        width: 100%;
        height: 400px;
        border-radius: 15px;
        border: none;
    }
</style>

<div class="contacto-container">
    <h1 style="text-align:center; color:#667eea; margin-bottom: 40px;">📍 Contáctanos</h1>
    
    <div class="contacto-grid">
        <div class="contacto-form">
            <h2>📧 Envíanos un mensaje</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" name="nombre" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Asunto *</label>
                    <input type="text" name="asunto" required>
                </div>
                <div class="form-group">
                    <label>Mensaje *</label>
                    <textarea name="mensaje" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Enviar Mensaje 🚀</button>
            </form>
        </div>
        
        <div class="map-container">
            <h3 style="color:#667eea; margin-bottom: 20px;">📍 Ubicaciones</h3>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d47330.5!2d-5.58!3d42.5982!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd3639a0c8b7b0d7%3A0x6b8a8b8b8b8b8b8b!2sLe%C3%B3n%2C%20Spain!5e0!3m2!1sen!2ses!4v1234567890123!5m2!1sen!2ses" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
            <div style="margin-top: 20px;">
                <p><strong>📍 Taquilla:</strong> Calle La Hoz, León</p>
                <p><strong>🅿️ Parking:</strong> Calle Cardenal Landazuri 21, León</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
